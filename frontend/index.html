<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOUND QUEST | Capacitacao Industrial Acessivel</title>
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mark.svg?v=green2" />
    <meta name="description" content="Plataforma corporativa de capacitacao industrial acessivel para pessoas com deficiencia auditiva." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css?v=green2" />
    <link rel="stylesheet" href="/src/theme.css?v=green2" />
    <style>
      :root {
        --navy: #0b5c3a !important;
        --navy-2: #0f7a4a !important;
        --green: #16a34a !important;
        --bg: #ffffff !important;
        --card: #ffffff !important;
        --text: #1a2e24 !important;
        --line: #d7e8de !important;
        --yellow: #16a34a !important;
      }
      html, body { background: #ffffff !important; color: #1a2e24 !important; }
      .auth-wrap { background: #ffffff !important; }
      .auth-side {
        background: linear-gradient(165deg, #0b5c3a, #0f7a4a 60%, #16a34a) !important;
        color: #ffffff !important;
        border: 0 !important;
      }
      .auth-form, .auth-card, .card, .form { background: #ffffff !important; }
      .btn-primary, .btn-dark, button[type="submit"] {
        background: #0f7a4a !important;
        color: #ffffff !important;
        border: 0 !important;
      }
      .a11y-bar { background: #ffffff !important; border: 1px solid #d7e8de !important; }
      .a11y-bar button {
        background: #ffffff !important;
        color: #0b5c3a !important;
        border: 1px solid #d7e8de !important;
      }
      .a11y-bar button[aria-pressed="true"] {
        background: #0f7a4a !important;
        color: #ffffff !important;
      }
      .sidebar { background: linear-gradient(180deg, #0b5c3a, #0f7a4a) !important; color: #fff !important; }
      .kicker { color: #bbf7d0 !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
